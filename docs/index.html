<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog animations</title>

<link rel="stylesheet" href="theme.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    padding: 40px 24px;
  }
  h1 { font-size: 28px; color: var(--accent); margin-bottom: 32px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  a.card {
    display: block;
    background: var(--card);
    border: 2px solid var(--border);
    padding: 20px;
    text-decoration: none;
    color: var(--text);
    font-size: 20px;
    font-weight: 700;
    transition: border-color .2s;
  }
  a.card:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<h1>ANIMATIONS</h1>

  <a class="card" href="metaphone.html">METAPHONE</a>
  <a class="card" href="phonetic-vs-edit.html">PHONETIC vs EDIT</a>
  <a class="card" href="pipeline-latency.html">LATENCY</a>
  <a class="card" href="acronym-hashmap.html">ACRONYM HASHMAP</a>
  <a class="card" href="context-window.html">CONTEXT WINDOW</a>
  <a class="card" href="lazy-load-progression.html">LAZY LOAD</a>
  <a class="card" href="sandbox-chaining.html">SANDBOX CHAINING</a>
</div>
</body>
</html>
