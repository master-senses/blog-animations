<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLI vs MCP Stack</title>
<link rel="stylesheet" href="theme.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 780px;
    background: var(--card);
    border: 2px solid var(--accent);
  }
  .card-header {
    padding: 20px 24px;
    border-bottom: 2px solid var(--accent);
  }
  .title { font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
  .subtitle { margin-top: 8px; font-size: 16px; font-weight: 600; color: var(--text-soft); }
  .body { padding: 32px 24px 28px; }

  .stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .layer {
    width: 100%;
    max-width: 520px;
    border: 2px solid var(--border);
    background: var(--surface);
    padding: 16px 20px;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    position: relative;
  }
  .layer.agent { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); max-width: 300px; }
  .layer.api { border-color: var(--accent); color: var(--accent); font-size: 22px; }
  .wrappers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    width: 100%;
    max-width: 520px;
  }
  .layer.wrap { font-size: 18px; }
  .arrow-down {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .fork {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 12px;
    width: 100%;
    max-width: 520px;
    align-items: center;
  }
  .fork-line { height: 2px; background: var(--border); }
  .note {
    margin-top: 22px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-soft);
    line-height: 1.6;
  }
  .note strong { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="title">CLI vs MCP</div>
    <div class="subtitle">different wrappers · same endpoints</div>
  </div>
  <div class="body">
    <div class="stack">
      <div class="layer agent">Agent harness</div>
      <div class="arrow-down">↑ ↑</div>
      <div class="wrappers">
        <div class="layer wrap">gh CLI</div>
        <div class="layer wrap">GitHub MCP</div>
      </div>
      <div class="fork">
        <div class="fork-line"></div>
        <div class="arrow-down">↑</div>
        <div class="fork-line"></div>
      </div>
      <div class="layer api">GitHub API</div>
    </div>
    <div class="note">
      both wrap the same REST endpoints<br>
      <strong>confusing CLI ≈ confusing MCP</strong>
    </div>
  </div>
</div>
</body>
</html>
